<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WavePublish — Authorization</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         max-width: 640px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #1a1a1a; text-align: center; }
  .code-box { margin: 24px 0; padding: 18px; background: #f3f3f3; border-radius: 10px;
              font-family: ui-monospace, Menlo, monospace; word-break: break-all; font-size: 0.95rem; }
  button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 8px;
           background: #111; color: #fff; cursor: pointer; }
  .muted { color: #666; font-size: 0.9rem; }
</style>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <h1>Authorization received</h1>
  <p>Copy the code below and paste it back into the WavePublish app.</p>
  <div class="code-box" id="code">—</div>
  <button onclick="copyCode()">Copy code</button>
  <p class="muted" id="msg"></p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const err = params.get("error");
    const box = document.getElementById("code");
    if (code) { box.textContent = code; }
    else if (err) { box.textContent = "Error: " + err + " — " + (params.get("error_description") || ""); }
    else { box.textContent = "No code found in URL."; }
    function copyCode() {
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        document.getElementById("msg").textContent = "Copied!";
      });
    }
  </script>
</body>
</html>
